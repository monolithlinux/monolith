# Monolith's startup screen. The theme is /usr/share/plymouth/themes/monolith.
#
# DeviceScale=1 keeps Plymouth from enlarging the theme on screens it takes for
# dense ones. It would stretch the small pictures, which blurs them. The theme
# has larger pictures of its own and uses them by the boot menu's rule.
[Daemon]
Theme=monolith
DeviceScale=1
