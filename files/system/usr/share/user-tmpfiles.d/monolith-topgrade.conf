# Let topgrade run `monolith update`. At each login, link the image's drop-in
# into the account unless that path already exists, so a user's own file
# (even an empty one) wins. Opt out by masking this rule:
#   ln -s /dev/null ~/.config/user-tmpfiles.d/monolith-topgrade.conf
# topgrade ignores the link if the target disappears, e.g. after a rebase.
L %h/.config/topgrade.d/monolith.toml - - - - /usr/share/monolith/topgrade.d/monolith.toml
