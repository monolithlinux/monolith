# topgrade also updates software installed with `monolith`.
# Linked into each account as ~/.config/topgrade.d/monolith.toml by
# /usr/share/user-tmpfiles.d/monolith-topgrade.conf.
[commands]
"Monolith software" = "monolith update"

# Note each finished run, even one with failed steps, for the login update
# reminder (/usr/libexec/monolith/update-reminder).
[post_commands]
"Record update time" = "/usr/libexec/monolith/update-reminder --record"
