# Monolith's boot menu: graphics, the theme and a five second wait.
#
# The grub.cfg bootupd installs is static and never reads /etc/default/grub.
# It does read user.cfg, so libexec/monolith/boot-menu keeps these lines
# there as a marked block. Settings of your own go in custom.cfg, which GRUB
# reads last.
#
# On a computer whose screen is 1800 pixels tall or more, boot-menu puts
# up to two lines of its own above these:
#   set monolith_scale=2       draw the menu at twice the size
#   set monolith_half=WxH      half that screen's size, to ask the firmware
#                              for when Secure Boot is on; left out once the
#                              firmware turned out not to have that mode
set gfxmode=auto
set gfxpayload=keep
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
# GRUB's own font, from inside its signed file. Without it the frames GRUB
# draws around the edit screen come out as rows of boxes.
loadfont unicode
set monolith_theme=theme.txt
if [ "${monolith_scale}" = "2" ]; then
  if [ "${lockdown}" = "y" ]; then
    # Secure Boot is on, and GRUB then reads no font from the disk, so its
    # text can't be made larger. At half the screen's resolution the monitor
    # doubles everything instead. Without that mode only the logo is doubled.
    if [ -n "${monolith_half}" ]; then
      set gfxmode=${monolith_half},auto
    else
      set monolith_theme=theme-2x-logo.txt
    fi
  elif loadfont ${prefix}/themes/monolith/unifont-32.pf2; then
    set monolith_theme=theme-2x.txt
  else
    set monolith_theme=theme-2x-logo.txt
  fi
fi
if terminal_output gfxterm; then
  # -s: there, and not empty. With an empty theme GRUB shows a white screen
  # and no entries; without one it shows its plain list.
  if [ -s ${prefix}/themes/monolith/${monolith_theme} ]; then
    set theme=${prefix}/themes/monolith/${monolith_theme}
    export theme
  fi
fi
unset monolith_scale
unset monolith_half
unset monolith_theme
set timeout=5
set timeout_style=menu
