# Monolith's boot menu: graphics, the theme and a five second wait.
#
# The grub.cfg bootupd installs is static and never reads /etc/default/grub.
# It does read user.cfg, so libexec/monolith/boot-menu keeps these lines
# there as a marked block. Settings of your own go in custom.cfg, which GRUB
# reads last.
set gfxmode=auto
set gfxpayload=keep
insmod all_video
insmod gfxterm
insmod gfxmenu
insmod png
# GRUB's own font, from inside its signed file. Without it the frames GRUB
# draws around the edit screen come out as rows of boxes.
loadfont unicode
if terminal_output gfxterm; then
  # -s: there, and not empty. With an empty theme GRUB shows a white screen
  # and no entries; without one it shows its plain list.
  if [ -s ${prefix}/themes/monolith/theme.txt ]; then
    set theme=${prefix}/themes/monolith/theme.txt
    export theme
  fi
fi
set timeout=5
set timeout_style=menu
