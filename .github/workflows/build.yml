name: bluebuild
on:
  schedule:
    # Daily at 1:11 am Central, hours after Fedora updates its Kinoite image
    # (usually 8-10 pm Central). Off the hour, because GitHub delays scheduled
    # runs most at the start of each hour.
    - cron: "11 1 * * *"
      timezone: "America/Chicago"
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      # Announcements are fetched from main at runtime and never change an image.
      - "news/**"

  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  test:
    name: Test scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Test Monolith software manager
        run: |
          tests/monolith-paths.sh
          tests/monolith-software.sh
          python3 tests/gear-lever-apps.py
          tests/monolith-topgrade.sh
          tests/opendeck-flatpak-migration.sh
          tests/monolith-update-reminder.sh
      - name: Test the monolith command
        run: |
          # The versions in the image: just 1.59 from Fedora 44, and fish 4.6.
          mkdir -p "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP"
          curl -fsSLO https://github.com/casey/just/releases/download/1.59.0/just-1.59.0-x86_64-unknown-linux-musl.tar.gz
          curl -fsSLO https://github.com/fish-shell/fish-shell/releases/download/4.6.0/fish-4.6.0-linux-x86_64.tar.xz
          sha256sum -c <<'EOF'
          409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e  just-1.59.0-x86_64-unknown-linux-musl.tar.gz
          497c9c4e3fb3c006fe9d2c9a5a5447c1c90490b6b4ce6bfaf75e53b495c82f36  fish-4.6.0-linux-x86_64.tar.xz
          EOF
          tar -xzf just-1.59.0-x86_64-unknown-linux-musl.tar.gz -C bin just
          tar -xJf fish-4.6.0-linux-x86_64.tar.xz -C bin fish
          sudo apt-get update && sudo apt-get install -y zsh
          cd "$GITHUB_WORKSPACE"
          PATH="$RUNNER_TEMP/bin:$PATH" tests/monolith-command.sh
          tests/monolith-system-commands.sh
      - name: Test edition selection
        run: bash tests/pick-editions.sh
      - name: Test Monolith News
        run: python3 tests/monolith-news.py
      - name: Test Protontricks desktop icon
        run: tests/protontricks-icon.sh
      - name: Test Ghostty integration
        run: |
          tests/ghostty-launcher.sh
          tests/ptyxis-compat.sh
          tests/ghostty-window-size.sh
          node tests/ghostty-window-size-persistence.js
          python3 tests/ghostty-themes.py
          node tests/ghostty-plasma.js

  # Skip no-op nightlies and limit PR builds to affected editions.
  # Unknown PR paths build everything; non-image paths build nothing.
  check:
    name: Check if a rebuild is needed
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
      editions: ${{ steps.editions.outputs.editions }}
      any: ${{ steps.editions.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      # Keep these entries in sync with pick-editions.sh.
      - name: Pick editions to build
        id: editions
        shell: bash
        run: |
          set -euo pipefail
          # A file preserves pick-editions.sh's exit status.
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            .github/workflows/pick-editions.sh all > built.txt
          else
            git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null \
              || git fetch --quiet origin main:refs/remotes/origin/main
            .github/workflows/pick-editions.sh origin/main...HEAD > built.txt
          fi
          readarray -t built < built.txt
          has() { case " ${built[*]:-} " in *" $1 "*) return 0 ;; *) return 1 ;; esac; }

          entries=()
          if has kde; then entries+=('{"label":"KDE","recipe":"recipe-kde.yml"}'); fi
          if has kde-nvidia; then entries+=('{"label":"KDE NVIDIA","recipe":"recipe-kde-nvidia.yml"}'); fi

          if [ "${#entries[@]}" -gt 0 ]; then
            ( IFS=,; echo "editions=[${entries[*]}]" >> "${GITHUB_OUTPUT}" )
            echo "any=true" >> "${GITHUB_OUTPUT}"
          else
            echo "No edition is affected by this change; skipping the builds."
            echo "editions=[]" >> "${GITHUB_OUTPUT}"
            echo "any=false" >> "${GITHUB_OUTPUT}"
          fi

      - name: Compare published images against current inputs
        id: check
        shell: bash
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "skip=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          command -v skopeo >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y skopeo jq; }
          skip=true
          for img in $(.github/workflows/pick-editions.sh all); do
            ref="docker://ghcr.io/monolithlinux/${img}"
            # Published labels identify the prior base digest and Fedora version.
            if ! latest=$(skopeo inspect --no-tags "${ref}:latest" 2>/dev/null); then
              echo "${img}: could not inspect :latest; building to be safe"
              skip=false
              break
            fi
            base_name=$(jq -r '.Labels["org.opencontainers.image.base.name"] // ""' <<<"${latest}")
            base_then=$(jq -r '.Labels["org.opencontainers.image.base.digest"] // ""' <<<"${latest}")
            fedora=$(jq -r '.Labels["org.opencontainers.image.version"] // ""' <<<"${latest}" | cut -d. -f1)
            # Announcement and documentation commits never trigger a build, so accept the
            # newest published main commit whose image inputs match this one.
            sha_tag=""
            for commit in $(git rev-list --first-parent "${GITHUB_SHA}"); do
              if ! changed=$(.github/workflows/pick-editions.sh "${commit}..${GITHUB_SHA}") || [ -n "${changed}" ]; then
                break
              fi
              if skopeo inspect --no-tags --format ok "${ref}:${commit::7}-${fedora}" >/dev/null 2>&1; then
                sha_tag="${commit::7}-${fedora}"
                break
              fi
            done
            if [ -z "${sha_tag}" ]; then
              echo "${img}: no published image matches ${GITHUB_SHA::7}'s image inputs; this commit needs a build"
              skip=false
              break
            fi
            base_now=$(skopeo inspect --no-tags --format '{{.Digest}}' "docker://${base_name}" 2>/dev/null)
            if [ -z "${base_name}" ] || [ -z "${base_then}" ] || [ -z "${base_now}" ] || [ "${base_then}" != "${base_now}" ]; then
              echo "${img}: base ${base_name:-unknown} moved (${base_then:-?} -> ${base_now:-?}); rebuild needed"
              skip=false
              break
            fi
            echo "${img}: ${sha_tag} matches ${GITHUB_SHA::7}'s image inputs and base ${base_name} unchanged"
          done
          [ "${skip}" = true ] && echo "Nothing changed since the last build; skipping the nightly."
          echo "skip=${skip}" >> "${GITHUB_OUTPUT}"

  bluebuild:
    name: Build ${{ matrix.label }}
    needs: check
    if: github.actor != 'dependabot[bot]' && needs.check.outputs.skip != 'true' && needs.check.outputs.any == 'true'
    runs-on: ubuntu-latest
    env:
      BB_REGISTRY: ghcr.io
      BB_REGISTRY_NAMESPACE: monolithlinux
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.check.outputs.editions) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Extract kernel signing key
        shell: bash
        env:
          KERNEL_SIGNING_SECRET: ${{ secrets.KERNEL_SIGNING_SECRET }}
        run: |
          if [ -z "${KERNEL_SIGNING_SECRET}" ]; then
            echo "::error::KERNEL_SIGNING_SECRET is not set (run 'just generate-secureboot-key' and add it)." >&2
            exit 1
          fi
          printf '%s' "${KERNEL_SIGNING_SECRET}" | base64 -d > MOK.priv
          chmod 600 MOK.priv

      - name: Install Chunkah dependencies
        shell: bash
        run: |
          missing=()
          command -v envsubst >/dev/null 2>&1 || missing+=(gettext-base)
          command -v podman   >/dev/null 2>&1 || missing+=(podman)
          command -v skopeo   >/dev/null 2>&1 || missing+=(skopeo)
          command -v crun     >/dev/null 2>&1 || missing+=(crun)
          if [ ${#missing[@]} -gt 0 ]; then
            sudo apt-get update
            sudo apt-get install -y "${missing[@]}"
          fi

      - name: Build and publish image
        uses: blue-build/github-action@v1.13.0
        with:
          recipe: ${{ matrix.recipe }}
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          chunkah: true
          max_layers: 300
          registry: ghcr.io
          registry_namespace: monolithlinux
          registry_username: ${{ github.actor }}
          registry_token: ${{ github.token }}
          pr_event_number: ${{ github.event.number }}
          skip_checkout: true
          maximize_build_space: true
          retry_push_count: 3

  # The one build check branch protection requires. Build jobs exist only for
  # the editions a pull request affects, so requiring them by name would leave
  # other pull requests waiting forever; this job always reports instead.
  build-result:
    name: Build result
    needs: [test, check, bluebuild]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Fail unless the tests, check, and every edition build passed
        env:
          TEST: ${{ needs.test.result }}
          CHECK: ${{ needs.check.result }}
          BUILD: ${{ needs.bluebuild.result }}
        run: |
          echo "Test scripts: ${TEST}; rebuild check: ${CHECK}; builds: ${BUILD}"
          [ "${TEST}" = success ] && [ "${CHECK}" = success ] || exit 1
          # Skipped means no edition needed a build.
          case "${BUILD}" in success | skipped) ;; *) exit 1 ;; esac

  generate-release:
    name: Release
    needs: bluebuild
    if: github.event_name != 'pull_request'
    permissions:
      contents: write
      packages: read
    uses: ./.github/workflows/generate_release.yml
