name: Bug report
description: Something in Monolith doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time. Running `monolith report-bug` opens this form with your system details already filled in.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How can we see it ourselves?
      description: The steps that make it happen, if you know them.
  - type: textarea
    id: system
    attributes:
      label: Your system
      description: "`monolith report-bug` fills this in. Otherwise, paste the output of `monolith status`."
      render: text
