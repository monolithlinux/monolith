# Monolith News feed.
#
# Monolith KDE systems download this file from the main branch at login and
# whenever Monolith News is opened, so merged changes reach users without an
# image update (GitHub may serve the previous copy for up to five minutes).
#
# Add new announcements at the top and delete ones that no longer apply.
# People who dismissed the window see it again only when an announcement with a
# new id appears. Editing an existing entry, including its date, does not show it
# again; publish a new id instead.
#
#   id     unique; 1-64 lowercase letters, digits, or hyphens; never reuse one
#   date   publication date shown to users (YYYY-MM-DD)
#   title  one line, at most 120 characters
#   body   Markdown; raw HTML is shown as plain text
#   links  optional, at most 3 buttons: { label = "...", url = "https://..." }
#          (labels: one line, at most 40 characters)
#
# Preview before opening a pull request (does not touch your dismissals):
#   files/kde/usr/bin/monolith-news --preview news/announcements.toml

[[announcements]]
id = "2026-10-03-r2modman"
date = 2026-10-03
title = "r2modman joins Monolith Software"
body = """
After booting an updated Monolith image, run **monolith**, open **Gaming**, and
select **r2modman** to install the mod manager for Thunderstore games such as
**Lethal Company**, **Risk of Rain 2**, and **Valheim**.

As with WowUp-CF, Monolith downloads the official AppImage, checks it against the
checksum GitHub publishes, and adds it to **Gear Lever**. A supported existing
r2modman integration is reused instead of creating another launcher. If Gear
Lever is missing, Monolith asks before installing its Flathub Flatpak for your
account.

Monolith installs the newest **stable** r2modman release, and r2modman may also
update itself to newer stable releases. Close r2modman before using **monolith
update r2modman** or running topgrade. Removal keeps your profiles, mods, and
settings. If r2modman is not in your Gaming menu yet, update Monolith and reboot
first.
"""
links = [
  { label = "r2modman releases", url = "https://github.com/ebkr/r2modmanPlus/releases" },
  { label = "Monolith software guide", url = "https://github.com/monolithlinux/monolith#r2modman" },
]

[[announcements]]
id = "2026-10-01-wowup-cf"
date = 2026-10-01
title = "WowUp-CF joins Monolith Software"
body = """
After booting an updated Monolith image, run **monolith**, open **Gaming**, and
select **WowUp-CF** to install the CurseForge edition with **World of Warcraft:
Forever** support. The refreshed software menu has explicit install, update, and
remove actions.

Monolith adds WowUp-CF to **Gear Lever** and reuses a supported existing
integration instead of creating another launcher. If Gear Lever is missing,
Monolith asks before installing its Flathub Flatpak for your account.

For now, Monolith follows only the **2.24.0 beta** series. Once a compatible
**2.24.0 or newer stable** is available, it switches to stable and does not enroll
you in later beta series. WowUp's application release channel is set to Stable;
addon release settings are unchanged.

Close WowUp-CF before using **monolith update wowup-cf**. Removal keeps your
settings, game installations, and addons. If Gaming is not in your menu yet,
update Monolith and reboot first.
"""
links = [
  { label = "WowUp-CF releases", url = "https://github.com/WowUp/WowUp.CF/releases" },
  { label = "Monolith software guide", url = "https://github.com/monolithlinux/monolith#optional-software" },
]

[[announcements]]
id = "2026-09-30-monolith-news"
date = 2026-09-30
title = "Welcome to Monolith News"
body = """
Monolith News shares project announcements, such as required actions and notable
changes. It checks the Monolith GitHub repository when you log in and opens only
when there is something new.

After you dismiss this window, it stays closed until the next announcement. Open
**Monolith News** from the application menu to read past announcements, or clear
**Check for announcements at login** below to stop the login check.
"""
links = [
  { label = "Read the README", url = "https://github.com/monolithlinux/monolith#readme" },
]
