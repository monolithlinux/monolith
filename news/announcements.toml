# Monolith News feed.
#
# Monolith KDE systems download this file from the main branch at login and
# whenever Monolith News is opened, so merged changes reach users without an
# image update (GitHub may serve the previous copy for up to five minutes).
#
# Add new announcements at the top and delete ones that no longer apply.
# People who dismissed the window see it again only when an announcement with a
# new id appears. Editing an existing entry, including its date, does not show it
# again; publish a new id instead.
#
#   id            unique; 1-64 lowercase letters, digits, or hyphens; never reuse one
#   date          publication date shown to users (YYYY-MM-DD)
#   title         one line, at most 120 characters
#   category      optional label beside the date, such as "Gaming"; one line, at
#                 most 24 characters
#   install_path  optional "Get it" steps, such as ["monolith", "Gaming", "r2modman"];
#                 at most 5 steps of one line and at most 40 characters each
#   body          Markdown; raw HTML is shown as plain text
#   note          optional tip shown below the body; one line, at most 240 characters
#   links         optional, at most 3 buttons: { label = "...", url = "https://..." }
#                 (labels: one line, at most 40 characters)
#
# Older Monolith images ignore category, install_path, and note, so keep anything
# essential in body.
#
# Preview before opening a pull request (does not touch your read state):
#   files/kde/usr/bin/monolith-news --preview news/announcements.toml

[[announcements]]
id = "2026-10-04-fedora-kinoite-base"
date = 2026-10-04
title = "Monolith now builds directly on Fedora Kinoite"
category = "Monolith"
body = """
Monolith images are now built on Fedora's own Kinoite image instead of
Universal Blue's. Nothing is required from you: the next update switches
over by itself and keeps your settings, Flatpaks, and Secure Boot key.

- **Same tools:** the CachyOS kernel, Terra Mesa, Steam, codecs, controller
  rules, and the daily automatic updates are all still included.
- **Same commands:** `ujust monolith-adopt` and
  `ujust enroll-monolith-secure-boot-key` work as before. Run `ujust` to see
  Monolith's own list of helper commands; Universal Blue's extra recipes
  (for example `ujust distrobox-assemble` and `ujust toggle-nvk`) are gone.

If something stopped working after this update, report it on GitHub.
"""
links = [
  { label = "Report a problem", url = "https://github.com/monolithlinux/monolith/issues" },
]

[[announcements]]
id = "2026-10-03-prism-launcher"
date = 2026-10-03
title = "Prism Launcher joins Monolith Software"
category = "Gaming"
install_path = ["monolith", "Gaming", "Prism Launcher"]
body = """
Prism Launcher is a Minecraft launcher for separate instances, mod loaders, and
modpacks. To install it, run `monolith`, open **Gaming**, and select
**Prism Launcher**.

- **No extra setup:** Monolith installs the official Flathub Flatpak for your
  account, so no administrator password or Gear Lever is needed.
- **Already installed?** Monolith reuses a copy installed for your account. A
  system-wide copy, such as one from Bazaar, is left alone rather than installed
  twice.
- **Updates:** It updates like any other Flatpak, including the daily automatic
  update, Bazaar, topgrade, and `monolith update prismlauncher`. You do not need
  to close it first.
- **Your data stays:** Removing Prism Launcher keeps your instances, worlds,
  accounts, and settings.

Not in your Gaming menu yet? Update Monolith and reboot first.
"""
links = [
  { label = "Prism Launcher", url = "https://prismlauncher.org" },
  { label = "Prism Launcher on Flathub", url = "https://flathub.org/apps/org.prismlauncher.PrismLauncher" },
  { label = "Monolith software guide", url = "https://github.com/monolithlinux/monolith#prism-launcher" },
]

[[announcements]]
id = "2026-10-03-r2modman"
date = 2026-10-03
title = "r2modman joins Monolith Software"
category = "Gaming"
install_path = ["monolith", "Gaming", "r2modman"]
body = """
r2modman is a mod manager for Thunderstore games such as **Lethal Company**,
**Risk of Rain 2**, and **Valheim**. To install it, run `monolith`, open
**Gaming**, and select **r2modman**.

- **Verified download:** Monolith downloads the official AppImage, checks it
  against the checksum GitHub publishes, and adds it to Gear Lever. If Gear
  Lever is missing, Monolith offers to install it from Flathub for your account.
- **Already installed?** Monolith reuses a supported copy in Gear Lever rather
  than adding a second launcher.
- **Updates:** Monolith installs the newest stable release, and r2modman can
  also update itself to newer stable releases. Close r2modman before running
  `monolith update r2modman` or topgrade.
- **Your data stays:** Removing r2modman keeps your profiles, mods, and
  settings.

Not in your Gaming menu yet? Update Monolith and reboot first.
"""
links = [
  { label = "r2modman releases", url = "https://github.com/ebkr/r2modmanPlus/releases" },
  { label = "Monolith software guide", url = "https://github.com/monolithlinux/monolith#r2modman" },
]

[[announcements]]
id = "2026-10-01-wowup-cf"
date = 2026-10-01
title = "WowUp-CF joins Monolith Software"
category = "Gaming"
install_path = ["monolith", "Gaming", "WowUp-CF"]
body = """
WowUp-CF is the CurseForge edition of the WowUp addon manager, with
**World of Warcraft: Forever** support. To install it, run `monolith`, open
**Gaming**, and select **WowUp-CF**.

- **Gear Lever:** Monolith adds WowUp-CF to Gear Lever. If Gear Lever is
  missing, Monolith offers to install it from Flathub for your account.
- **Already installed?** Monolith reuses a supported copy in Gear Lever rather
  than adding a second launcher.
- **Beta for now:** Monolith follows the 2.24.0 beta series until a compatible
  2.24.0 or newer stable release is out, then switches to stable and skips
  later betas. WowUp-CF's own application release channel is set to Stable;
  addon release settings are unchanged.
- **Updates:** Close WowUp-CF before running `monolith update wowup-cf`.
- **Your data stays:** Removing WowUp-CF keeps your settings, game
  installations, and addons.
- **Also new:** The software menu now has explicit install, update, and remove
  actions.

No Gaming category in your menu yet? Update Monolith and reboot first.
"""
links = [
  { label = "WowUp-CF releases", url = "https://github.com/WowUp/WowUp.CF/releases" },
  { label = "Monolith software guide", url = "https://github.com/monolithlinux/monolith#optional-software" },
]

[[announcements]]
id = "2026-09-30-monolith-news"
date = 2026-09-30
title = "Welcome to Monolith News"
category = "Monolith"
body = """
Monolith News shares project announcements, such as required actions and
notable changes.

- It checks the Monolith GitHub repository when you log in and opens only when
  there is something new.
- After you close this window, it stays closed until the next announcement.
- To read past announcements, open **Monolith News** from the application menu.
- To stop the login check, turn it off at the bottom of this window.
"""
links = [
  { label = "Read the README", url = "https://github.com/monolithlinux/monolith#readme" },
]
