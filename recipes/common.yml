---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
# Desktop-neutral layer shared by every edition.
modules:
  - type: files
    files:
      - source: system
        destination: /

  # Codec and VA-API overrides that the ublue base used to provide.
  - type: dnf
    repos:
      files:
        - https://negativo17.org/repos/fedora-multimedia.repo
      keys:
        - https://negativo17.org/repos/RPM-GPG-KEY-slaanesh
    remove:
      auto-remove: false
      packages:
        # Flathub comes from the default-flatpaks module; drop Fedora's filtered
        # third-party plumbing (also removes plasma-welcome-fedora).
        - fedora-third-party
        - fedora-flathub-remote
        - fedora-workstation-repositories
    replace:
      - from-repo: fedora-multimedia
        skip-unavailable: true
        packages:
          - libva

  - type: dnf
    install:
      packages:
        - repo: fedora-multimedia
          skip-unavailable: true
          packages:
            - intel-vaapi-driver
    replace:
      - from-repo: fedora-multimedia
        skip-unavailable: true
        packages:
          - libva-intel-media-driver
          - intel-gmmlib
          - intel-mediasdk
          - intel-vpl-gpu-rt

  - type: dnf
    install:
      packages:
        - repo: fedora-multimedia
          packages:
            - libva-utils
            - pipewire-libs-extra
    replace:
      - from-repo: fedora-multimedia
        packages:
          - old: ffmpeg-free
            new: ffmpeg
          - old: fdk-aac-free
            new: libfdk-aac
          - old: libavcodec-free
            new: libavcodec

  - type: dnf
    install:
      packages:
        - repo: fedora-multimedia
          packages:
            - ffmpeg-libs

  - type: script
    snippets:
      - |
        # Keep negativo17 multimedia ahead of Fedora for user layering, as the old
        # base did, and never let it offer Mesa (Mesa comes from Terra below).
        set -euxo pipefail
        dnf5 -y config-manager setopt fedora-multimedia.priority=90 "fedora-multimedia.exclude=mesa-*"

  - type: dnf
    repos:
      copr:
        - lilay/topgrade
      files:
        - https://brave-browser-rpm-nightly.s3.brave.com/brave-browser-nightly.repo
        - https://negativo17.org/repos/fedora-steam.repo
        - https://pkgs.tailscale.com/stable/fedora/tailscale.repo
      keys:
        - https://brave-browser-rpm-nightly.s3.brave.com/brave-core-nightly.asc
        - https://negativo17.org/repos/RPM-GPG-KEY-slaanesh
        - https://pkgs.tailscale.com/stable/fedora/repo.gpg
    install:
      packages:
        # Basics
        - fish
        # Optional software helpers and terminal compatibility commands.
        - python3
        - git
        - gh
        - curl
        - btop
        - fastfetch
        # The monolith software dashboard and the WowUp-CF helper's readelf.
        - fzf
        - binutils
        # Editor
        - micro
        # Shared terminal
        - ptyxis
        # Container-based userland
        - distrobox
        # Fonts
        - google-noto-fonts-all
        # Tailscale's official stable RPM
        - tailscale
        # Updating helper
        - topgrade
        # Steam/controller support
        - steam-devices
        # Gaming tools
        - gamescope
        - gamemode
        - mangohud
        - vkBasalt
        - vulkan-tools
        - winetricks
        - protontricks
        - evtest
        # FUSE 2 support for AppImages (provides libfuse.so.2)
        - fuse-libs
        # Brave Origin
        - brave-origin-nightly
        # Layered Steam RPM
        - steam
        # Host virtualization stack; files/system grants wheel users access.
        - virt-manager
        - libvirt-daemon-kvm
        - libvirt-daemon-config-network
        - libvirt-client
        - edk2-ovmf
        - swtpm
        - swtpm-tools
        # Packages the ublue base used to provide.
        - just                      # ujust front-end
        - fuse                      # fusermount for libfuse2 AppImages
        - flatpak-spawn
        - alsa-firmware
        - libratbag-ratbagd
        - openrgb-udev-rules
        - solaar-udev
        - libimobiledevice-utils
        - pam-u2f
        - pam_yubico
        - pamu2fcfg
        - yubikey-manager
        - nvtop
        - lshw
        - powerstat
        - squashfs-tools
        - symlinks
        - tmux
        - vim-enhanced
        - tcpdump
        - traceroute
        - apr
        - apr-util
        - grub2-tools-extra
        - libcamera-gstreamer
        - libcamera-tools
        - google-noto-sans-balinese-fonts
        - google-noto-sans-cjk-fonts       # static CJK fonts; /usr/share/fonts/noto-cjk target
        - google-noto-sans-javanese-fonts
        - google-noto-sans-sundanese-fonts
    remove:
      packages:
        - firefox
        - firefox-langpacks
        # Distrobox replaces toolbox.
        - toolbox

  - type: script
    scripts:
      - fix-protontricks-icon.sh
    snippets:
      - |
        # Install a versionlocked CachyOS kernel and sched-ext tools from
        # transient COPR URLs without shipping repository files.
        set -euxo pipefail

        kernel_repo="https://download.copr.fedorainfracloud.org/results/bieszczaders/kernel-cachyos/fedora-\$releasever-\$basearch/"
        addons_repo="https://download.copr.fedorainfracloud.org/results/bieszczaders/kernel-cachyos-addons/fedora-\$releasever-\$basearch/"

        # Suppress kernel-install hooks during the bootc transaction; the recipe's
        # initramfs module runs after depmod and any NVIDIA module build.
        pushd /usr/lib/kernel/install.d
        mv 05-rpmostree.install 05-rpmostree.install.bak
        mv 50-dracut.install 50-dracut.install.bak
        printf '%s\n' '#!/bin/sh' 'exit 0' > 05-rpmostree.install
        printf '%s\n' '#!/bin/sh' 'exit 0' > 50-dracut.install
        chmod +x 05-rpmostree.install 50-dracut.install
        popd

        for pkg in kernel kernel-core kernel-modules kernel-modules-core kernel-modules-extra; do
          rpm --erase "$pkg" --nodeps || true
        done
        rm -rf /usr/lib/modules

        dnf5 -y install --nogpgcheck \
          --repofrompath "cachyos-kernel,$kernel_repo" \
          kernel-cachyos kernel-cachyos-core kernel-cachyos-modules kernel-cachyos-devel-matched

        pushd /usr/lib/kernel/install.d
        mv -f 05-rpmostree.install.bak 05-rpmostree.install
        mv -f 50-dracut.install.bak 50-dracut.install
        popd

        # Generate module metadata before later layers and initramfs creation.
        depmod -a "$(ls /usr/lib/modules)"

        # sched-ext userspace tools
        dnf5 -y install --nogpgcheck \
          --repofrompath "cachyos-addons,$addons_repo" \
          scx-scheds scx-tools

        # Modules are baked at build time; no persistent SELinux boolean is needed.

        # Prevent runtime transactions from replacing the kernel.
        dnf5 versionlock add \
          kernel-cachyos \
          kernel-cachyos-core \
          kernel-cachyos-modules \
          kernel-cachyos-devel-matched

  # Sign the CachyOS kernel with the build-only MOK key used by NVIDIA too.
  - type: script
    env:
      PUBLIC_KEY_DER_PATH: /etc/pki/akmods/certs/akmods-monolith.der
    secrets:
      - type: file
        source: ./MOK.priv
        mount:
          type: file
          destination: /tmp/certs/private_key.priv
    scripts:
      - sign-kernel.sh

  - type: systemd
    system:
      enabled:
        - tailscaled.service
        - monolith-firstboot-label.service
        # scx_loader picks the default sched-ext scheduler at boot.
        - scx_loader.service
        # Socket-activated modular libvirt daemons.
        - virtqemud.socket
        - virtnetworkd.socket
        - virtstoraged.socket
        - virtlogd.socket
        - virtlockd.socket
        # Daily 04:00 staged OS and Flatpak updates, as on the old base.
        - rpm-ostreed-automatic.timer
        - flatpak-system-update.timer
      masked:
        # default-flatpaks deletes the Fedora remote again on every boot.
        - flatpak-add-fedora-repos.service
    user:
      enabled:
        - flatpak-user-update.timer

  - type: fonts
    fonts:
      nerd-fonts:
        - JetBrainsMono

  # Shared Flatpaks; desktop apps live in each DE layer.
  - type: default-flatpaks
    configurations:
      - notify: false
        scope: system
        install:
          - it.mijorus.gearlever
          - io.github.kolunmi.Bazaar
          - com.ranfdev.DistroShelf
          - com.vysp3r.ProtonPlus
          - com.github.zocker_160.SyncThingy
          - com.saivert.pwvucontrol
          - org.jellyfin.JellyfinDesktop
          - io.github.getnf.embellish
          - org.cryptomator.Cryptomator
          - io.github.wivrn.wivrn
          - io.github.Faugus.faugus-launcher
          - com.system76.Popsicle
          - com.github.tchx84.Flatseal
          - org.mozilla.Thunderbird
          - com.yubico.yubioath
      - scope: user
        notify: false

  - type: script
    snippets:
      - |
        # Add Terra repo and swap mesa to Terra build.
        set -euxo pipefail
        dnf5 -y install --nogpgcheck \
          --repofrompath terra,https://repos.fyralabs.com/terra\$releasever \
          terra-release terra-release-mesa
        dnf5 -y config-manager setopt "*terra*".priority=1
        dnf5 -y config-manager setopt "terra-mesa".enabled=false
        dnf5 -y config-manager setopt "fedora-steam".exclude="mesa-*"
        dnf5 -y config-manager setopt "*fedora*".exclude="mesa-*"
        dnf5 --enable-repo=terra-mesa -y swap mesa-filesystem mesa-filesystem
        dnf5 --enable-repo=terra-mesa -y install \
          mesa-libOpenCL \
          mesa-libEGL.i686
        dnf5 versionlock add \
          mesa-dri-drivers \
          mesa-filesystem \
          mesa-libEGL \
          mesa-libGL \
          mesa-libgbm \
          mesa-vulkan-drivers
        dnf5 -y config-manager setopt terra.enabled=false
        dnf5 -y config-manager setopt "fedora-steam".enabled=false
      # Optional upstream CLIs are managed per-user by `monolith`.
      - |
        # Fail the build if the software manager or its helpers cannot start.
        set -euxo pipefail
        test -x /usr/bin/monolith
        test -x /usr/libexec/monolith/ghostty-themes
        test -x /usr/libexec/monolith/gear-lever-app
        bash -n /usr/bin/monolith
        # Help must not need or touch a home directory.
        HOME=/nonexistent /usr/bin/monolith help >/dev/null
        HOME=/nonexistent python3 -B /usr/libexec/monolith/gear-lever-app --help >/dev/null
        for command in fzf python3 curl flock readelf flatpak; do
          command -v "$command" >/dev/null
        done
        # The login rule must link a drop-in that the image ships.
        home="$(mktemp -d)"
        HOME="$home" XDG_RUNTIME_DIR="$home" \
          systemd-tmpfiles --user --create /usr/share/user-tmpfiles.d/monolith-topgrade.conf
        test -f "$(readlink "$home/.config/topgrade.d/monolith.toml")"
        rm -rf "$home"
        # Replacements for the old base: ujust, FUSE 2, rescue boot, codecs, updates.
        test -x /usr/bin/ujust
        HOME=/nonexistent /usr/bin/ujust --list >/dev/null
        recipes="$(HOME=/nonexistent /usr/bin/ujust --summary | tr ' ' '\n')"
        for recipe in monolith monolith-adopt enroll-monolith-secure-boot-key update changelogs \
            toggle-updates check-idle-power-draw setup-luks-tpm-unlock remove-luks-tpm-unlock; do
          grep -qx "$recipe" <<<"$recipes"
        done
        test -x /usr/bin/fusermount
        test -x /usr/lib/systemd/system-generators/coreos-sulogin-force-generator
        test -x /usr/libexec/luks-enable-tpm2-autounlock
        test -x /usr/libexec/luks-disable-tpm2-autounlock
        decoders="$(ffmpeg -hide_banner -decoders)"
        grep -qE '^ V.* h264 ' <<<"$decoders"
        grep -qE '^ V.* hevc ' <<<"$decoders"
        vendors="$(rpm -q --qf '%{VENDOR}\n' ffmpeg-libs libavcodec libva pipewire-libs-extra)"
        if grep -vx 'negativo17.org' <<<"$vendors"; then exit 1; fi
        grep -qx 'AutomaticUpdatePolicy=stage' /etc/rpm-ostreed.conf
        test -f /etc/flatpak/remotes.d/flathub.flatpakrepo
      - |
        # Flatpak apps miss host CJK glyphs with fontconfig 2.17 (Fedora 44)
        # unless this path exists; fontconfig 2.18 (Fedora 45) fixes it.
        set -euxo pipefail
        if [ "$(rpm -E %fedora)" -le 44 ] && [ ! -e /usr/share/fonts/noto-cjk ]; then
          ln -s /usr/share/fonts/google-noto-sans-cjk-fonts /usr/share/fonts/noto-cjk
        fi
      - |
        # Bash completion for ujust: just's dynamic completion, re-pointed at
        # ujust so it lists Monolith's recipes.
        set -euxo pipefail
        JUST_COMPLETE=bash just | sed -E 's/just/ujust/g' > /usr/share/bash-completion/completions/ujust
        grep -q 'complete .*-F _clap_complete_ujust ujust' /usr/share/bash-completion/completions/ujust
      - |
        # Install Pure system-wide without a runtime plugin manager.
        set -euxo pipefail
        tmpdir="$(mktemp -d)"
        git clone --depth=1 https://github.com/pure-fish/pure "$tmpdir"
        # Keep defaults session-scoped so image updates do not write or freeze
        # values in each user's fish_variables.
        sed -i 's/set --universal/set --global/' "$tmpdir/functions/_pure_set_default.fish"
        grep -q 'set --global' "$tmpdir/functions/_pure_set_default.fish"
        ! grep -q 'set --universal' "$tmpdir/functions/_pure_set_default.fish"
        install -d /usr/share/fish/vendor_functions.d /usr/share/fish/vendor_conf.d
        cp -a "$tmpdir/functions/." /usr/share/fish/vendor_functions.d/
        cp -a "$tmpdir/conf.d/."    /usr/share/fish/vendor_conf.d/
        chmod -R a+rX /usr/share/fish/vendor_functions.d /usr/share/fish/vendor_conf.d
        rm -rf "$tmpdir"
        test -f /usr/share/fish/vendor_functions.d/fish_prompt.fish
        test -f /usr/share/fish/vendor_conf.d/pure.fish
      - |
        # Install the shared Monolith logo under the os-release icon name.
        set -euxo pipefail
        src=/usr/share/pixmaps/monolith/greeter-logo.png
        install -Dm0644 "$src" /usr/share/icons/hicolor/128x128/apps/monolith-logo-icon.png
        install -Dm0644 "$src" /usr/share/pixmaps/monolith-logo-icon.png
        if command -v gtk-update-icon-cache >/dev/null; then
          gtk-update-icon-cache -f /usr/share/icons/hicolor || true
        fi
        # GNOME Settings uses Fedora's fixed light/dark distributor-logo paths.
        install -Dm0644 /usr/share/pixmaps/monolith/greeter-logo-dark.png \
          /usr/share/pixmaps/fedora_logo_med.png
        install -Dm0644 "$src" /usr/share/pixmaps/fedora_whitelogo_med.png
      - |
        # Compile shared GTK/Ptyxis defaults.
        dconf update
