---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: kde-nvidia
description: Monolith KDE image with the open NVIDIA driver built for CachyOS.
base-image: quay.io/fedora-ostree-desktops/kinoite
image-version: 45

modules:
  - from-file: common.yml

  - from-file: kde.yml

  - from-file: nvidia.yml

  - type: os-release
    properties:
      NAME: Monolith
      PRETTY_NAME: Monolith KDE (NVIDIA)
      ID: monolith
      ID_LIKE: fedora
      VARIANT: KDE (NVIDIA)
      VARIANT_ID: kde
      DEFAULT_HOSTNAME: monolith
      LOGO: monolith-logo-icon
      HOME_URL: https://github.com/monolithlinux/monolith
      DOCUMENTATION_URL: https://github.com/monolithlinux/monolith
      SUPPORT_URL: https://github.com/monolithlinux/monolith/issues
      BUG_REPORT_URL: https://github.com/monolithlinux/monolith/issues

  - type: script
    snippets:
      - |
        # Changing the login shell breaks an account when a later image lacks
        # that shell, so the old base removed these too; Ghostty starts fish by
        # itself. Last, so no later package transaction can restore them.
        set -euxo pipefail
        rm -f /usr/bin/chsh /usr/bin/lchsh
        test ! -e /usr/bin/chsh
        test ! -e /usr/bin/lchsh

  # After the last package change: Plasma's core has to come from a single
  # Plasma release, and OpenCL has to run. See the scripts.
  - type: script
    scripts:
      - check-plasma-versions.py
      - check-opencl.py

  - type: initramfs

  - type: signing

  # Last, after everything that writes files; see the script.
  - type: script
    scripts:
      - stabilize-layers.py
