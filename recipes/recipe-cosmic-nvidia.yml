---
# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: cosmic-nvidia
description: Monolith COSMIC image with the open NVIDIA driver built for CachyOS.
base-image: ghcr.io/ublue-os/base-main
image-version: 44

modules:
  - from-file: common.yml

  - from-file: base-main.yml
  - from-file: cosmic.yml

  - from-file: nvidia.yml

  - type: os-release
    properties:
      NAME: Monolith
      PRETTY_NAME: Monolith COSMIC (NVIDIA)
      ID: monolith
      ID_LIKE: fedora
      VARIANT: COSMIC (NVIDIA)
      VARIANT_ID: cosmic
      DEFAULT_HOSTNAME: monolith
      LOGO: monolith-logo-icon
      HOME_URL: https://github.com/monolithlinux/monolith
      DOCUMENTATION_URL: https://github.com/monolithlinux/monolith
      SUPPORT_URL: https://github.com/monolithlinux/monolith/issues
      BUG_REPORT_URL: https://github.com/monolithlinux/monolith/issues

  - type: initramfs

  - type: signing
